services:
  - type: web
    name: starpush
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /health

    # Persistent disk — keeps SQLite data across deploys and restarts
    disk:
      name: starpush-db
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production

      # Persistent disk path for SQLite database
      - key: DATA_DIR
        value: /var/data

      # Your custom domain — used for Stripe redirect URLs & password-reset emails
      - key: APP_URL
        value: https://starpush.io

      # Auth — generate with: node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
      - key: JWT_SECRET
        sync: false

      # Admin API key — any secret string you choose
      - key: ADMIN_KEY
        sync: false

      # Twilio SMS
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false

      # Default Google review link (used in SMS when user hasn't set one in their profile)
      - key: DEFAULT_REVIEW_LINK
        sync: false

      # Anthropic AI
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL_HAIKU
        value: claude-haiku-4-5-20251001
      - key: ANTHROPIC_MODEL_SONNET
        value: claude-sonnet-4-6
      - key: PROMO_CODE
        sync: false

      # Stripe payments
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_STARTER_PRICE_ID
        sync: false
      - key: STRIPE_GROWTH_PRICE_ID
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false

      # Email — AOL SMTP for welcome emails, password resets, trial reminders
      - key: SMTP_HOST
        value: smtp.aol.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: clujkeebs@aol.com
      - key: SMTP_FROM
        value: "Starpush <clujkeebs@aol.com>"
      # SMTP_PASS must be an AOL App Password (not your AOL login password)
      # Generate one at: myaccount.aol.com → Security → App passwords
      - key: SMTP_PASS
        sync: false
